name: Update fuel price benchmarks

# Refreshes src/data/benchmarks.json from the EU Weekly Oil Bulletin.
# A commit by this workflow triggers a normal Vercel redeploy.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - scripts/update-benchmarks.mjs
      - .github/workflows/update-benchmarks.yml
  schedule:
    # Tuesdays and Thursdays 09:17 UTC — the bulletin is usually published early in the week.
    - cron: "17 9 * * 2,4"

permissions:
  contents: write

concurrency:
  group: update-benchmarks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/update-benchmarks.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/benchmarks.json && git ls-files --error-unmatch src/data/benchmarks.json >/dev/null 2>&1; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/benchmarks.json
          git commit -m "Update fuel price benchmarks (EU Weekly Oil Bulletin)"
          git pull --rebase origin master
          git push origin HEAD:master
